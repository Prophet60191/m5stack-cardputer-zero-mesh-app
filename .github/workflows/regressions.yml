name: Offline regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Install dependencies from signed Ubuntu sources
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y ninja-build libpng-dev libjpeg-dev libfmt-dev libsdl2-dev libfreetype-dev zlib1g-dev
      - run: python3 -m venv .venv && .venv/bin/pip install cmake==3.31.6 meshtastic==2.7.11
      - run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch qualified LVGL source
        run: |
          git init --quiet "$RUNNER_TEMP/lvgl"
          git -C "$RUNNER_TEMP/lvgl" fetch --depth 1 https://github.com/lvgl/lvgl.git 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          git -C "$RUNNER_TEMP/lvgl" checkout --detach FETCH_HEAD
      - run: .venv/bin/cmake -S . -B build/ci -G Ninja -DFETCHCONTENT_SOURCE_DIR_LVGL="$RUNNER_TEMP/lvgl" -DUSE_DESKTOP=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: .venv/bin/cmake --build build/ci -j 2
      - run: ASAN_OPTIONS=detect_leaks=0 .venv/bin/ctest --test-dir build/ci --output-on-failure
  debian-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out reviewed non-publishing Store checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Prophet60191/m5stack-cardputer-zero-app-guide
          ref: 2dcf438d7acfe29054b76c3b612ce84ceb02226a
          path: build/store-guide
          persist-credentials: false
      - name: Check out reviewed Store policy and catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CardputerZero/packages
          ref: b6c559a0448aae7715c4b45678a0b89c9eceb12b
          path: build/store-packages
          persist-credentials: false
      - name: Fetch and verify the published upgrade baseline
        run: |
          mkdir -p "$RUNNER_TEMP/cz-baseline"
          curl --fail --location --retry 3 https://github.com/Prophet60191/m5stack-cardputer-zero-mesh-app/releases/download/v0.1.8-rc.1/cardputerzero-mesh_0.1.8_rev1_arm64.deb -o "$RUNNER_TEMP/cz-baseline/mesh-0.1.8.deb"
          printf '%s  %s\n' 8ff56073d45b43ed1cd1212f46bbdfcc9e345219c0897fbdf97d5fac2ad7b3b4 "$RUNNER_TEMP/cz-baseline/mesh-0.1.8.deb" | sha256sum -c -
      - name: Fetch qualified LVGL source
        run: |
          git init --quiet "$RUNNER_TEMP/lvgl"
          git -C "$RUNNER_TEMP/lvgl" fetch --depth 1 https://github.com/lvgl/lvgl.git 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          git -C "$RUNNER_TEMP/lvgl" checkout --detach FETCH_HEAD
      - name: Fetch pinned native source (no device or RF access)
        run: |
          git init "$RUNNER_TEMP/firmware"
          git -C "$RUNNER_TEMP/firmware" fetch --depth 1 https://github.com/meshtastic/firmware.git 54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb
          git -C "$RUNNER_TEMP/firmware" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/firmware" submodule update --init --depth 1 protobufs
      - name: Build qualified native runtime with full corresponding source
        run: |
          docker build -t cz-native-runtime scripts/meshtasticd-gps
          mkdir -p "$RUNNER_TEMP/native-out" "$RUNNER_TEMP/pio-core"
          docker run --rm \
            -v "$RUNNER_TEMP/firmware:/work" \
            -v "$RUNNER_TEMP/pio-core:/root/.platformio" \
            -v "$RUNNER_TEMP/native-out:/out" \
            -v "$PWD/scripts/meshtasticd-gps:/support:ro" \
            cz-native-runtime sh -c 'git config --global --add safe.directory /work; sh /support/build.sh'
          docker run --rm --network none -e CZ_MESH_ISOLATED_TEST=1 \
            -v "$RUNNER_TEMP/native-out:/out:ro" \
            -v "$PWD/scripts/meshtasticd-gps:/support:ro" \
            cz-native-runtime python3 /support/test_daemon.py /out/meshtasticd
      - name: Prepare hash-locked Python wheels and private runtime
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-stage" "$RUNNER_TEMP/python-cache"
          docker run --rm -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/native-out:/native:ro" \
            -v "$RUNNER_TEMP/runtime-stage:/out" \
            -v "$RUNNER_TEMP/python-cache:/cache" \
            cz-native-runtime python3 /src/scripts/runtime/prepare.py \
              --native /native --cache /cache --output /out/runtime
      - name: Build matching Debian 13 arm64 environment
        run: docker build -t cz-mesh-arm64 -f tests/Dockerfile .
      - name: Build, install and validate package in an isolated namespace
        run: |
          mkdir -p "$RUNNER_TEMP/cz-build"
          docker run --rm --network none --cap-add NET_ADMIN \
            -e CZ_MESH_ISOLATED_TEST=1 \
            -e CZ_MESH_UPGRADE_BASELINE=/baseline/mesh-0.1.8.deb \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/lvgl:/lvgl:ro" \
            -v "$RUNNER_TEMP/cz-baseline:/baseline:ro" \
            -v "$RUNNER_TEMP/cz-build:/work" \
            -v "$RUNNER_TEMP/runtime-stage/runtime:/runtime:ro" \
            cz-mesh-arm64 sh /src/tests/linux-package-check.sh
      - name: Record checksums and corresponding source
        run: |
          mkdir -p "$RUNNER_TEMP/cz-artifact"
          cp "$RUNNER_TEMP/cz-build/linux/dist/"*.deb "$RUNNER_TEMP/cz-artifact/"
          cd "$RUNNER_TEMP/cz-artifact"
          sha256sum *.deb > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
      - name: Minimal Debian fresh-install, offline first-run and removal
        run: |
          mkdir -p "$RUNNER_TEMP/fresh-context"
          cp "$RUNNER_TEMP/cz-artifact/"*.deb "$RUNNER_TEMP/fresh-context/cardputerzero-mesh.deb"
          cp tests/Dockerfile.fresh-runtime "$RUNNER_TEMP/fresh-context/Dockerfile"
          docker build -t cz-mesh-fresh "$RUNNER_TEMP/fresh-context"
          docker run --rm --network none -e CZ_MESH_ISOLATED_TEST=1 \
            -v "$PWD:/src:ro" cz-mesh-fresh sh /src/tests/fresh-runtime-check.sh
      - name: Export complete release-ready source and dependency assets
        run: |
          mesh_version=$(python3 -c 'import json; print(json.load(open("app-builder.json"))["version"])')
          docker run --rm --network none -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/cz-build:/work:ro" \
            -v "$RUNNER_TEMP/native-out:/native:ro" \
            -v "$RUNNER_TEMP/runtime-stage:/runtime-stage:ro" \
            -v "$RUNNER_TEMP/lvgl:/lvgl:ro" \
            -v "$RUNNER_TEMP/cz-artifact:/out" \
            cz-mesh-arm64 python3 /src/scripts/runtime/export_release.py \
              --deb "/work/linux/dist/cardputerzero-mesh_${mesh_version}-rev1_arm64.deb" \
              --native /native --runtime /runtime-stage/runtime \
              --python-source /runtime-stage/python-corresponding-source.tar.gz \
              --lvgl /lvgl --output /out
      - name: Inspect the exact candidate without publishing
        run: |
          mesh_version=$(python3 -c 'import json; print(json.load(open("app-builder.json"))["version"])')
          python3 build/store-guide/tools/store_preflight.py \
            --app . \
            --deb "$RUNNER_TEMP/cz-artifact/cardputerzero-mesh_${mesh_version}-rev1_arm64.deb" \
            --packages-dir build/store-packages --uploader Prophet60191 \
            --source-commit "$GITHUB_SHA" --json > "$RUNNER_TEMP/cz-artifact/store-preflight.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardputerzero-mesh-debian13-arm64
          path: |
            ${{ runner.temp }}/cz-artifact/*.deb
            ${{ runner.temp }}/cz-artifact/SHA256SUMS
            ${{ runner.temp }}/cz-artifact/SOURCE_COMMIT
            ${{ runner.temp }}/cz-artifact/store-preflight.json
            ${{ runner.temp }}/cz-artifact/*-source-and-dependencies.tar.gz
            ${{ runner.temp }}/cz-artifact/RUNTIME_BUILD_INFO.json
            ${{ runner.temp }}/cz-artifact/INSTALL.txt
            ${{ runner.temp }}/cz-artifact/VIDEO-CHECKLIST.md
          if-no-files-found: error
      - name: Stage the non-installed keyboard replay helper
        run: |
          mkdir -p "$RUNNER_TEMP/cz-keyboard"
          cp "$RUNNER_TEMP/cz-build/linux/mesh_keyboard_evdev_regressions" "$RUNNER_TEMP/cz-keyboard/"
          cp tests/fixtures/cardputerzero-keymap.map LICENSE NOTICE THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/cz-keyboard/"
          cp -R licenses "$RUNNER_TEMP/cz-keyboard/"
          cd "$RUNNER_TEMP/cz-keyboard"
          sha256sum mesh_keyboard_evdev_regressions cardputerzero-keymap.map > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardputerzero-mesh-keyboard-replay-arm64
          path: ${{ runner.temp }}/cz-keyboard/
          if-no-files-found: error
      - name: Stage the non-installed channel setup replay helper
        run: |
          mkdir -p "$RUNNER_TEMP/cz-channel-setup"
          cp "$RUNNER_TEMP/cz-build/linux/mesh_channel_setup_regressions" "$RUNNER_TEMP/cz-channel-setup/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/cz-channel-setup/"
          cp -R licenses "$RUNNER_TEMP/cz-channel-setup/"
          cd "$RUNNER_TEMP/cz-channel-setup"
          sha256sum mesh_channel_setup_regressions > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardputerzero-mesh-channel-setup-replay-arm64
          path: ${{ runner.temp }}/cz-channel-setup/
          if-no-files-found: error
